# A starting point for listing this mod in the KSA content index (https://github.com/KSAModding/content-index).
# Copy it to listings/<your mod id>.toml in a fork of that repository, fill it in, and open a pull request.
# Publish a release first: the index checks your latest release when you open the pull request.
spec_version = 1
id = "inf_fuel"                     # the folder name, the same as MOD_ID in the release workflow
type = "mod"
name = "Infinite Fuel"
authors = ["SafeShows"]
abstract = "Keeps the controlled vehicle's tanks full, even while burning. Toggle it in the Mods menu."
license = "MIT-0"
tags = ["gameplay"]# see tags.toml in the content index

[releases]
github = "SafeShows/oxidizer-inf-fuel"

[links]
forums = "https://forums.ahwoo.com/forums/kitten-space-agency/mod-releases/infinite-fuel-tanks-that-never-run-dry-oxidizer.1715/"
repository = "https://github.com/SafeShows/oxidizer-inf-fuel"

[compatibility]
game_min = "2026.11.10.5801"

# Oxidizer mods run as StarMap mods that need Oxidizer.StarMap, so mod managers install both for you.
# They also run with standalone Oxidizer.
[loader]
id = "StarMap"
min = "0.5.3"                      # the StarMap version that runs the current game; the index requires a min

[[dependencies]]
id = "Oxidizer.StarMap"
kind = "required"
min = "0.8.0"                      # loaded() and dependencies need Oxidizer 0.8
